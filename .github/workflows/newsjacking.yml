name: Newsjacking Articles

on:
  schedule:
    # Target: 08:00 America/Chicago, every day. GitHub cron is UTC-only and has no concept
    # of daylight saving, so one fixed time drifts by an hour for half the year. Instead we
    # fire at both candidate hours — 13:00 UTC (= 08:00 CDT, summer) and 14:00 UTC
    # (= 08:00 CST, winter) — and the run step drops whichever one isn't 08:00 locally.
    # GitHub's scheduler is best-effort and can lag under load, so treat it as approximate.
    - cron: "0 13 * * *"
    - cron: "0 14 * * *"
  workflow_dispatch:
    # Lets the run be triggered by hand from the GitHub website or mobile app — the point
    # being that it needs no laptop at all.
    inputs:
      send_email:
        description: "Send the digest (false = collect and log only)"
        type: boolean
        default: true
        required: false

# The job commits its state caches back to the repo, so it needs write access.
permissions:
  contents: write

concurrency:
  # Two overlapping runs would both write the state caches and race each other.
  group: newsjacking
  cancel-in-progress: false

jobs:
  digest:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run the digest
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          RESEND_FROM: ${{ secrets.RESEND_FROM }}
          LINKDAPI_API_KEY: ${{ secrets.LINKDAPI_API_KEY }}
          PYTHONPATH: src
          PYTHONIOENCODING: utf-8
          # A manual run can collect and log without mailing anyone.
          SEND_EMAIL: ${{ github.event.inputs.send_email || 'true' }}
        run: |
          # Two crons fire daily; only the one that lands on 08:00 in Chicago does the work.
          # A manual run always proceeds, whatever the hour.
          if [ "${{ github.event_name }}" = "schedule" ] && [ "$(TZ=America/Chicago date +%H)" != "08" ]; then
            echo "Local time in Chicago is $(TZ=America/Chicago date +%H:%M), not 08:00 — this is the off-season cron. Skipping."
            exit 0
          fi
          python -m tada_ci.run_newsjacking

      - name: Persist state caches
        # Runners are wiped after each run. Without committing these back, every run would
        # look like a first run: the same articles resent daily and the competitor
        # seen-list rebuilt from scratch.
        if: always()
        run: |
          git config user.name "newsjacking-bot"
          git config user.email "noreply@github.com"
          git add data/ || true
          if git diff --staged --quiet; then
            echo "No state changes to commit."
          else
            git commit -m "chore: update run state [skip ci]"
            git push
          fi

      - name: Upload run log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: run-log
          path: data/runs/
          if-no-files-found: ignore
          retention-days: 30
