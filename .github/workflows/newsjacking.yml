name: Newsjacking Articles

on:
  schedule:
    # 13:00 UTC = 18:30 IST = 08:00 US Central, Monday to Friday.
    # GitHub's scheduler is best-effort and can lag under load, so treat the time as
    # approximate rather than exact.
    - cron: "0 13 * * 1-5"
  workflow_dispatch:
    # Lets the run be triggered by hand from the GitHub website or mobile app — the point
    # being that it needs no laptop at all.
    inputs:
      send_email:
        description: "Send the digest (false = collect and log only)"
        type: boolean
        default: true
        required: false

# The job commits its state caches back to the repo, so it needs write access.
permissions:
  contents: write

concurrency:
  # Two overlapping runs would both write the state caches and race each other.
  group: newsjacking
  cancel-in-progress: false

jobs:
  digest:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run the digest
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          RESEND_FROM: ${{ secrets.RESEND_FROM }}
          LINKDAPI_API_KEY: ${{ secrets.LINKDAPI_API_KEY }}
          PYTHONPATH: src
          PYTHONIOENCODING: utf-8
          # A manual run can collect and log without mailing anyone.
          SEND_EMAIL: ${{ github.event.inputs.send_email || 'true' }}
        run: python -m tada_ci.run_newsjacking

      - name: Persist state caches
        # Runners are wiped after each run. Without committing these back, every run would
        # look like a first run: the same articles resent daily and the competitor
        # seen-list rebuilt from scratch.
        if: always()
        run: |
          git config user.name "newsjacking-bot"
          git config user.email "noreply@github.com"
          git add data/ || true
          if git diff --staged --quiet; then
            echo "No state changes to commit."
          else
            git commit -m "chore: update run state [skip ci]"
            git push
          fi

      - name: Upload run log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: run-log
          path: data/runs/
          if-no-files-found: ignore
          retention-days: 30
