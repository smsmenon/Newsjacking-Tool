services:
  tada-content-intelligence:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    ports:
      - "8787:8787"
    env_file:
      - ../.env.example
    volumes:
      - ../work:/app/work

  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: tada_content_intelligence
      POSTGRES_USER: tada
      POSTGRES_PASSWORD: tada_local_password
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ../sql/schema.sql:/docker-entrypoint-initdb.d/schema.sql:ro

volumes:
  postgres-data:

